<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="수급 정리">
<meta name="theme-color" content="#F3F5F8">
<title>수급 정리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --panel:#FFFFFF; --ink:#16191F; --sub:#6A7180; --line:#E3E6EC;
  --buy:#D42A3C; --buy-soft:#FCE9EB; --sell:#1D5BC2; --sell-soft:#E6EEFB;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101318; --panel:#191D24; --ink:#EEF0F3; --sub:#8E95A3; --line:#2A303A;
    --buy:#FF5A69; --buy-soft:#3A1C21; --sell:#5B95F5; --sell-soft:#16263F;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{padding:22px 2px 12px}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
.meta{margin-top:4px;color:var(--sub);font-size:14px}

.searchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px}
.search{display:flex;gap:8px}
.search input{
  flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--panel);
  border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;
}
.search input:focus{border-color:var(--ink)}
.search button{font:inherit;font-size:15px;font-weight:500;border:0;border-radius:12px;padding:0 16px;background:var(--ink);color:var(--bg)}
.hint{color:var(--sub);font-size:13px;margin:6px 2px 0}

h2{font-size:17px;font-weight:700;margin:26px 2px 10px;letter-spacing:-.01em}
.panel{background:var(--panel);border-radius:16px;border:1px solid var(--line);overflow:hidden}

.row{padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.top{display:flex;align-items:baseline;gap:10px}
.rank{width:20px;color:var(--sub);font-size:14px;flex:none}
.name{flex:1;min-width:0;font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-size:19px;font-weight:700}
.up{color:var(--buy)} .down{color:var(--sell)} .zero{color:var(--sub)}
.streak{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:13px;color:var(--sub)}
.ticks{display:flex;gap:2px}
.ticks i{display:block;width:5px;height:12px;border-radius:2px}
.ticks.up i{background:var(--buy)} .ticks.down i{background:var(--sell)}
.others{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:13px;color:var(--sub)}
.others b{font-weight:500}
.allbuy{display:inline-block;margin-left:6px;font-size:12px;font-weight:500;color:var(--buy);background:var(--buy-soft);border-radius:6px;padding:1px 6px;vertical-align:2px}

.tabs{display:flex;gap:6px;margin:14px 2px 10px}
.tabs button{font:inherit;font-size:16px;font-weight:700;border:0;background:none;color:var(--sub);padding:6px 10px;border-radius:10px}
.tabs button[aria-selected="true"].b{background:var(--buy-soft);color:var(--buy)}
.tabs button[aria-selected="true"].s{background:var(--sell-soft);color:var(--sell)}
.badge{flex:none;font-size:14px;font-weight:700;border-radius:8px;padding:3px 9px;min-width:46px;text-align:center}
.badge.up{background:var(--buy-soft)} .badge.down{background:var(--sell-soft)}
.note{color:var(--sub);font-size:13px;margin:8px 2px 0;line-height:1.5}
.empty{padding:18px 16px;color:var(--sub);font-size:15px;line-height:1.5}
.clear{font:inherit;font-size:14px;background:none;border:0;color:var(--sub);text-decoration:underline;padding:4px 2px}

.row[data-code]{cursor:pointer}
.row[data-code]:active{background:var(--bg)}
.more{color:var(--sub);font-size:13px;margin-left:auto;flex:none}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;display:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{display:block}
.sheet .bar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 16px 10px;max-width:560px;margin:0 auto}
.sheet .bar h3{margin:0;font-size:20px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .bar button{font:inherit;font-size:15px;font-weight:500;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:7px 14px}
.sheet .body{max-width:560px;margin:0 auto;padding:0 16px 32px}
.sum{display:flex;align-items:baseline;gap:10px;margin:2px 2px 14px;color:var(--sub);font-size:14px}
.sum .amt{font-size:22px}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th,td{padding:10px 10px;text-align:right;border-top:1px solid var(--line)}
th{font-size:12px;font-weight:500;color:var(--sub);border-top:0;position:sticky;top:0;background:var(--panel)}
th:first-child,td:first-child{position:sticky;left:0;background:var(--panel);text-align:left;z-index:1}
td.px{color:var(--ink);font-weight:500}

.gtabs{display:flex;gap:6px;overflow-x:auto;margin:8px -16px 0;padding:2px 16px 4px;scrollbar-width:none}
.gtabs::-webkit-scrollbar{display:none}
.gtabs button{flex:none;font:inherit;font-size:15px;font-weight:500;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 14px}
.gtabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gdesc{color:var(--sub);font-size:13px;margin:10px 2px 0}
.split{font-size:12.5px;color:var(--sub);margin:5px 0 0 30px;display:flex;flex-wrap:wrap;gap:2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 2px 14px}
.chip{font-size:13px;font-weight:500;border-radius:8px;padding:4px 9px;background:var(--panel);border:1px solid var(--line);color:var(--sub)}
.chip.up{background:var(--buy-soft);border-color:transparent;color:var(--buy)}
.chip.down{background:var(--sell-soft);border-color:transparent;color:var(--sell)}

.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 10px 8px;margin-bottom:12px}
.chartbox svg{display:block;width:100%;height:auto}
.chartbox .ax{font-size:10px;fill:var(--sub)}
.chartbox .lbl{font-size:11px;fill:var(--sub);font-weight:500}
.ctabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0 2px;scrollbar-width:none}
.ctabs::-webkit-scrollbar{display:none}
.ctabs button{flex:none;font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--sub);border-radius:999px;padding:5px 11px}
.ctabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.top-tools{display:flex;align-items:center;gap:8px;margin:12px 2px 8px}
.top-tools .gdesc{margin:0;flex:1}
.tool{font:inherit;font-size:14px;font-weight:500;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:6px 12px;flex:none}
.tool.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.star{flex:none;font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--sub);border-radius:8px;padding:3px 8px;margin-left:6px}
.star.on{color:#B7791F;border-color:#F0D9A8;background:#FFF7E6}
@media (prefers-color-scheme:dark){.star.on{color:#F6C35B;border-color:#5A4720;background:#2B2414}}
.del{flex:none;font:inherit;font-size:13px;font-weight:700;border:0;background:var(--sell-soft);color:var(--sell);border-radius:8px;padding:5px 10px}
.sec{font-size:15px;font-weight:700;margin:22px 2px 8px;color:var(--sub)}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 12px 8px;margin-bottom:10px}
.mhead{display:flex;align-items:baseline;gap:8px;padding:0 4px}
.mhead .mn{font-size:16px;font-weight:700;flex:1;min-width:0}
.mhead .mv{font-size:19px;font-weight:700}
.mchg{font-size:13px;padding:2px 4px 6px;text-align:right}
.mcard svg{display:block;width:100%;height:auto}
.mcard .ax{font-size:10px;fill:var(--sub)}
.mnote{color:var(--sub);font-size:12.5px;padding:2px 4px 4px;line-height:1.45}
.gauge{position:relative;height:10px;border-radius:999px;margin:10px 4px 6px;
  background:linear-gradient(90deg,#1D5BC2 0%,#7FA6E6 30%,#C9CDD6 50%,#F09AA4 70%,#D42A3C 100%)}
.gauge i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.gscale{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);padding:0 4px}
.golink{display:block;margin:10px 4px 6px;text-align:center;text-decoration:none;font-size:15px;font-weight:700;
  background:var(--ink);color:var(--bg);border-radius:12px;padding:12px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 4px 8px}
.fcell{background:var(--bg);border-radius:10px;padding:8px 9px}
.fcell .ln{display:flex;align-items:baseline;justify-content:space-between;gap:4px;white-space:nowrap}
.fcell span{font-size:12px;color:var(--sub)}
.fcell b{font-size:14px;font-weight:700}
.fcell small{display:block;font-size:11px;color:var(--sub);margin-top:3px}
.munit{font-size:12px;color:var(--sub)}
.heat{position:relative;width:100%;aspect-ratio:3/4;margin:8px 0 4px;border-radius:10px;overflow:hidden;background:var(--line)}
.heat .hs{position:absolute;box-sizing:border-box;border:1.5px solid var(--panel)}
.heat .hs i{position:absolute;left:3px;top:1px;font-style:normal;font-size:9px;font-weight:700;color:rgba(255,255,255,.85);z-index:2;pointer-events:none;white-space:nowrap}
.heat .hb{position:absolute;box-sizing:border-box;border:.5px solid rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;overflow:hidden;text-align:center;line-height:1.1}
.heat .hb b{font-size:11px;font-weight:700}
.heat .hb span{font-size:9.5px;opacity:.95}
.hlegend{display:flex;justify-content:center;gap:2px;margin:6px 0 2px;font-size:10px;color:var(--sub)}
.hlegend i{display:inline-block;width:26px;height:10px;border-radius:2px}
.eve-sum{display:flex;align-items:center;gap:8px;margin:8px 4px 4px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.eve-sum b{font-size:16px}
.eve-g{margin:12px 0 0;border-radius:12px;padding:8px 10px 4px;background:var(--gbg);border-left:5px solid var(--gc)}
.eve-g h4{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--gc);display:flex;align-items:center;gap:6px}
.eve-g.g0{--gc:#5B4FD6;--gbg:#EFEDFD} .eve-g.g1{--gc:#0E8A7E;--gbg:#E5F5F2}
.eve-g.g2{--gc:#2E7D32;--gbg:#EAF4EA} .eve-g.g3{--gc:#B26A00;--gbg:#FFF3E0}
@media (prefers-color-scheme:dark){
  .eve-g.g0{--gc:#A79FFF;--gbg:#211E3A} .eve-g.g1{--gc:#5FD3C4;--gbg:#14302C}
  .eve-g.g2{--gc:#7FCB83;--gbg:#18291A} .eve-g.g3{--gc:#FFB74D;--gbg:#33260F}}
.eve-g .eve-row{border-top-color:rgba(0,0,0,.07)}
.eve-row{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.eve-row:first-of-type{border-top:0}
.eve-row .en{flex:1;min-width:0}
.eve-row .ev{color:var(--sub);font-size:12.5px}
.eve-row .ec{font-weight:700;min-width:62px;text-align:right}
.eve-row .tg{font-size:10.5px;color:var(--sub);border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-left:4px}
.ar{display:inline-block;font-size:11px;font-weight:700;line-height:1;border-radius:5px;padding:3px 4px;margin-right:6px;vertical-align:2px;border:1.5px solid currentColor}
.ar.up{color:var(--buy)} .ar.down{color:var(--sell)}
.ar.full.up{background:var(--buy);color:#fff;border-color:var(--buy)}
.ar.full.down{background:var(--sell);color:#fff;border-color:var(--sell)}
.sg{display:inline-block;white-space:nowrap;flex:none;font-size:11px;font-weight:700;line-height:1;border-radius:999px;padding:3px 7px;margin-left:6px;vertical-align:2px;color:#fff}
.sg.b{background:var(--buy)} .sg.s{background:var(--sell)} .sg.w{background:#C98A00} .sg.l{background:#6A7180}
.sgline{display:flex;gap:8px;align-items:flex-start;margin:0 2px 12px;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:14px;line-height:1.45}
.secgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.seccard{font:inherit;text-align:left;border:1px solid var(--line);border-left:5px solid var(--sc);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 8px 7px;min-width:0}
.seccard .sn{font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;gap:4px}
.seccard .st{font-size:11px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seccard .sc{font-size:17px;font-weight:700;margin-top:4px}
.seccard.on{outline:2px solid var(--ink)}
.syn{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:var(--buy);border-radius:5px;padding:1px 4px;margin-left:4px;vertical-align:2px}
.holdbar{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;font-weight:700;border:0;border-radius:12px;padding:12px 14px;margin:6px 0 4px;background:var(--sell-soft);color:var(--sell)}
.holdform{display:flex;gap:8px;margin:0 2px 12px}
.holdform input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
.empty-sm{color:var(--sub);font-size:14px;padding:10px 4px 12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>수급 정리</h1>
    <div class="meta" id="meta">불러오는 중…</div>
  </header>

  <div class="searchbar">
    <div class="search">
      <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="종목명 또는 종목번호" autocomplete="off">
      <button id="go" type="button">조회</button>
    </div>
    <div class="gtabs" role="tablist" id="gtabs"></div>
  </div>
  <div id="holdwrap"></div>
  <div id="result"></div>
  <div id="view"></div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="bar"><h3 id="sname"></h3><button type="button" class="star" id="sstar">☆ 즐겨찾기</button><button type="button" id="sclose">닫기</button></div>
  <div class="body" id="sbody"></div>
</div>

<script>
// v 순서: 연기금, 사모, 투신, 기관, 외국인, 개인
const LABELS = ["연기금","사모","투신","기관","외국인","개인"];
const GROUPS = [
  {k:"pension", tab:"연기금",                 inv:[0],       desc:"연기금 순매수 금액 기준이에요."},
  {k:"foreign", tab:"외국인",                 inv:[4],       desc:"외국인 순매수 금액 기준이에요."},
  {k:"inst3",   tab:"투신+사모+연기금",        inv:[2,1,0],   desc:"투신, 사모펀드, 연기금 세 곳을 더한 금액 기준이에요."},
  {k:"inst3f",  tab:"투신+사모+연기금+외국인", inv:[2,1,0,4], desc:"투신, 사모펀드, 연기금, 외국인 네 곳을 더한 금액 기준이에요."},
];
const ALIAS = {"하닉":"SK하이닉스","삼전":"삼성전자","한조양":"HD한국조선해양","에너빌":"두산에너빌리티","현차":"현대차"};
let DATA = null, MACRO = null, TAB = "macro", SIDE = "buy", EDIT = false, RANGE = 63;

const $ = id => document.getElementById(id);
const norm = s => String(s || "").toLowerCase().replace(/\s/g, "");
const cls = v => v > 0 ? "up" : v < 0 ? "down" : "zero";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = (v, d) => Number(v).toLocaleString("ko-KR", {minimumFractionDigits:d, maximumFractionDigits:d});
function fmt(v){
  if (v == null) return "–";
  return (v > 0 ? "+" : v < 0 ? "−" : "") + num(Math.abs(v), 1);
}
const pctFmt = p => p == null ? "–" : (p > 0 ? "+" : p < 0 ? "−" : "") + Math.abs(p).toFixed(2) + "%";
const gIndex = k => DATA.groups.indexOf(k);
const gSum = (s, g) => Math.round(g.inv.reduce((a, i) => a + (s.v[i] || 0), 0) * 10) / 10;
const gStreak = (s, g) => (s.s || [])[gIndex(g.k)] || 0;
const streakText = n => !n ? "연속 기록 없음" : `${Math.abs(n)}일 연속 ${n > 0 ? "매수" : "매도"}`;
const SG_TXT = {
  B1: "매수 1원칙 · 5일선 위 주도주",
  B2: "매수 2원칙 · 5~20일선 사이 눌림목",
  B3: "매수 3원칙 · 20일선 아래 바닥권",
  S1: "매도 1원칙 · 5일선 위 고점 신호 (절반 분할 매도 검토)",
  S2: "매도 2원칙 · 추세 붕괴 (정한 손절·익절 기준 확인)",
  W1: "주의 · 고점에서 대량 거래와 긴 윗꼬리가 나온 양봉. 다음 날 이 봉의 고가를 넘으면 경고는 풀리고, 저가를 깨면 매도 신호로 봐요.",
  W2: "주의 · 박스권(평평한 20일선)에서 20일선 아래로 밀렸어요. 다음 날 종가로 20일선을 회복하면 해제, 이 봉의 저가를 깨면 매도로 봐요.",
  W3: "주의(보조 규칙, 박병창 원칙 아님) · 매수③ 모양이 나왔지만, 고가가 내려오는 20일선에 닿고 밀렸어요. 20일선을 종가로 넘으면 다시 봐요.",
  L3: "바닥 관찰 · 매수 3원칙 준비: 역배열 하락 중 밑꼬리 긴 캔들이나 십자형이 나오고 저점을 더 안 낮췄어요. 다음에 거래량 실린 장대양봉이 나오면 매수③이에요."
};
const CIRC = ["", "①", "②", "③"];
// 예전 형식([종류, 번호, 이유, ★])이 섞여 들어와도 손절가를 잘못 읽지 않게 맞춤
function normG(g){
  if (!g) return g;
  if (g.length < 5) return [g[0], g[1], g[2], 0, g[3] || 0];
  return g;
}
function sgBadge(s){
  const g = s && normG(s.g);
  if (!g) return "";
  if (g[0] === "W") return `<span class="sg w" title="${g[2]}">주의</span>`;
  if (g[0] === "L") return `<span class="sg l" title="${g[2]}">바닥관찰${g[4] ? "★" : ""}</span>`;
  const buy = g[0] === "B";
  return `<span class="sg ${buy ? "b" : "s"}" title="${g[2]}">${buy ? "매수" : "매도"}${CIRC[g[1]] || ""}${g[4] ? "★" : ""}</span>`;
}
function sgLine(s){
  const g = s && normG(s.g);
  if (!g) return "";
  const stop = g[0] === "W" ? (g[3] ? `<br>확인 가격: ${g[1] === 1 ? "고가" : g[1] === 3 ? "20일선" : "저가"} <b>${Number(g[3]).toLocaleString("ko-KR")}원</b>` : "")
             : g[3] ? `<br>손절 기준: <b>${Number(g[3]).toLocaleString("ko-KR")}원</b> 아래로 내려가면` : "";
  const cl = (s.p || [])[0];
  const far = g[0] === "B" && g[3] && cl && (1 - g[3] / cl) * 100 > 5
    ? `<br>손절가가 ${((1 - g[3] / cl) * 100).toFixed(1)}% 떨어져 있어요. 오늘 종가에 산다면 <b>−5% 선 ${num(Math.round(cl * 0.95), 0)}원</b>을 먼저 기준으로 잡는 것도 방법이에요.` : "";
  // 수급 엇갈림: 신호 방향과 반대로 움직이는 큰손이 있으면 알려줌
  const pen = gStreak(s, GROUPS[0]), fr = gStreak(s, GROUPS[1]);
  let mix = "";
  if (g[0] === "B" && fr <= -3) mix = `<br>⚠️ 외국인은 ${-fr}일 연속 매도 중이라 신호 힘이 약할 수 있어요.`;
  if (g[0] !== "B" && pen >= 5) mix = `<br>⚠️ 연기금은 ${pen}일 연속 매수 중이라 매도 신호 힘이 약할 수 있어요.`;
  if (g[0] !== "B" && fr >= 3) mix += `<br>⚠️ 외국인은 ${fr}일 연속 매수 중이에요.`;
  let arl = "";
  if (g[0] === "B" && s.a) arl = s.a > 0
    ? `<br>${Math.abs(s.a) === 1 ? "정배열(5>10>20>60>120)" : "20일선이 60일선 위"}: 큰 흐름과 같은 방향이에요.`
    : `<br>${Math.abs(s.a) === 1 ? "역배열" : "20일선이 60일선 아래"}: 위에 60·120일선 저항이 남아 있어 단기 반등일 수 있어요.`;
  let syn = "";
  if (s.sec && g[0] === "B") syn = s.sy ? `<br>🔥 ${esc(s.sec)} 업종이 같이 오르는 날이에요 (업종 동조화).`
                                       : `<br>업종(${esc(s.sec)})은 같이 움직이지 않아요. 혼자 오른 거면 단발성일 수 있어요.`;
  return `<div class="sgline">${sgBadge(s)}<div>${SG_TXT[g[0] + g[1]] || ""}<br>이유: ${esc(g[2])}${stop}${far}${arl}${g[4] ? "<br>★ 외국인·기관이 사고 개인이 판, 손바뀜이 같이 나왔어요." : ""}${syn}${mix}</div></div>`;
}
function arBadge(s){
  const a = s && s.a;
  if (!a) return "";
  const up = a > 0, full = Math.abs(a) === 1;
  const tip = full ? (up ? "정배열: 5>10>20>60>120일선" : "역배열: 5<10<20<60<120일선")
                   : (up ? "20일선이 60일선 위" : "20일선이 60일선 아래");
  return `<span class="ar ${up ? "up" : "down"}${full ? " full" : ""}" title="${tip}">${up ? "정" : "역"}</span>`;
}
const ticks = n => `<span class="ticks ${cls(n)}">${"<i></i>".repeat(Math.min(Math.abs(n), 20))}</span>`;

// ---------- 즐겨찾기 (이 기기에 저장) ----------
const FKEY = "favs-v1";
let FAVS = [];
function loadFavs(seed){
  try { const v = JSON.parse(localStorage.getItem(FKEY)); if (Array.isArray(v)) { FAVS = v; return; } } catch (e) {}
  FAVS = seed.filter(w => w.code).map(w => ({c: w.code, n: w.name}));
  saveFavs();
}
function saveFavs(){ try { localStorage.setItem(FKEY, JSON.stringify(FAVS)); } catch (e) {} }
const isFav = c => FAVS.some(f => f.c === c);
function toggleFav(c){
  if (isFav(c)) FAVS = FAVS.filter(f => f.c !== c);
  else FAVS.push({c, n: (DATA.stocks[c] || {}).n || c});
  saveFavs();
}
const starBtn = c => `<button type="button" class="star ${isFav(c) ? "on" : ""}" data-star="${esc(c)}">${isFav(c) ? "★ 즐겨찾기" : "☆ 즐겨찾기"}</button>`;

// ---------- 보유 종목 (이 기기에만 저장) ----------
const HKEY = "hold-v1";
let HOLD = {};
try { HOLD = JSON.parse(localStorage.getItem(HKEY)) || {}; } catch (e) { HOLD = {}; }
function saveHold(){ try { localStorage.setItem(HKEY, JSON.stringify(HOLD)); } catch (e) {} }
const STOP_PCT = -5;   // 매수가 대비 손절 기준(%)
function holdStatus(code){
  const h = HOLD[code], s = DATA && DATA.stocks[code];
  if (!h || !s || !s.p) return null;
  const close = s.p[0], ret = (close / h.p - 1) * 100, m = s.m || [];
  const alerts = [];
  if (ret <= STOP_PCT) alerts.push(`매수가 대비 ${pctFmt(ret)} → −5% 손절선 이탈, 매도 검토`);
  else if (ret <= -3) alerts.push(`매수가 대비 ${pctFmt(ret)} → −3% 주의`);
  if (m[0] && close < m[0]) alerts.push(`종가가 5일선(${num(m[0], 0)}원) 아래`);
  if (m[1] && close < m[1]) alerts.push(`종가가 20일선(${num(m[1], 0)}원) 아래`);
  const g = normG(s.g);
  if (g && (g[0] === "S" || g[0] === "W")) alerts.push(`오늘 ${g[0] === "S" ? "매도" : "주의"} 신호: ${g[2]}`);
  const danger = ret <= STOP_PCT || (g && g[0] === "S");
  return {close, ret, alerts, danger, stopPrice: Math.round(h.p * (1 + STOP_PCT / 100))};
}
function holdSection(){
  const codes = Object.keys(HOLD).filter(c => DATA.stocks[c]);
  if (!codes.length) return `<div class="sec">보유 종목</div><div class="panel"><div class="empty">종목을 누르고 상세 화면에서 <b>보유 등록</b>을 하면 여기서 매일 점검해요.</div></div>`;
  const rows = codes.map(c => {
    const s = DATA.stocks[c], st = holdStatus(c), h = HOLD[c];
    return `<div class="row" ${EDIT ? "" : `data-code="${c}"`}><div class="top"><span class="name">${arBadge(s)}${esc(s.n)}${sgBadge(s)}</span>
      ${EDIT ? `<button type="button" class="del" data-unhold="${c}">보유 해제</button>` : `<span class="amt ${cls(st.ret)}">${pctFmt(st.ret)}</span>`}</div>
      <div class="split">매수가 ${num(h.p, 0)}원 · 종가 ${num(st.close, 0)}원 · −5% 선 ${num(st.stopPrice, 0)}원</div>
      ${st.alerts.length ? `<div class="split" style="color:${st.danger ? "var(--sell)" : "var(--sub)"};font-weight:${st.danger ? 700 : 400}">⚠️ ${st.alerts.map(esc).join("<br>⚠️ ")}</div>` : `<div class="split">✅ 기준 이상 없음</div>`}
    </div>`;
  }).join("");
  return `<div class="sec">보유 종목</div><div class="panel">${rows}</div>
    <p class="note">종가 기준으로 점검해요(저녁 7시 13분 자료가 확정). −5%는 매수가 대비 손절선이에요. 보유 정보는 이 폰에만 저장돼요.</p>`;
}
function holdBanner(){
  if (!DATA) return "";
  const bad = Object.keys(HOLD).filter(c => { const st = holdStatus(c); return st && st.danger; });
  if (!bad.length) return "";
  return `<button type="button" class="holdbar" id="holdbar">⚠️ 보유 종목 ${bad.length}개가 매도 기준에 닿았어요: ${bad.map(c => esc(DATA.stocks[c].n)).join(", ")} ›</button>`;
}

// ---------- 종목 행 (즐겨찾기 / 검색 결과) ----------
function detailRow(s, code, opt = {}){
  const v = s.v, ps = gStreak(s, GROUPS[0]);
  const all = v[0] > 0 && v[1] > 0 && v[2] > 0;
  const others = LABELS.slice(1).map((l, i) => `<span>${l} <b class="${cls(v[i+1])}">${fmt(v[i+1])}</b></span>`).join("");
  const right = opt.edit ? `<button type="button" class="del" data-del="${esc(code)}">삭제</button>`
                         : `<span class="amt ${cls(v[0])}">${fmt(v[0])}</span>`;
  return `<div class="row" ${opt.edit ? "" : `data-code="${esc(code)}"`}>
    <div class="top"><span class="name">${arBadge(s)}${esc(s.n)}${sgBadge(s)}${all ? '<span class="allbuy">기관 3곳 매수</span>' : ""}</span>
      ${opt.star ? starBtn(code) : ""}${right}</div>
    <div class="streak">${ticks(ps)}<span>연기금 ${streakText(ps)}</span>${opt.edit ? "" : '<span class="more">일자별 보기 ›</span>'}</div>
    <div class="others">${others}</div>
  </div>`;
}

function renderFav(){
  const rows = FAVS.map(f => {
    const s = DATA.stocks[f.c];
    if (s) return detailRow(s, f.c, {edit: EDIT});
    return `<div class="row"><div class="top"><span class="name">${esc(f.n)}</span>
      ${EDIT ? `<button type="button" class="del" data-del="${esc(f.c)}">삭제</button>` : ""}</div>
      <div class="streak">오늘 자료가 없어요.</div></div>`;
  }).join("");
  $("view").innerHTML = `${holdSection()}
    <div class="sec">즐겨찾기</div>
    <div class="top-tools"><p class="gdesc">검색 결과에서 ☆를 누르면 추가돼요. 큰 숫자는 연기금 순매수예요.</p>
      <button type="button" class="tool ${EDIT ? "on" : ""}" id="edit">${EDIT ? "완료" : "편집"}</button></div>
    <div class="panel">${rows || '<div class="empty">즐겨찾기가 비어 있어요. 위에서 종목을 검색해 ☆를 눌러 추가하세요.</div>'}</div>
    <p class="note">즐겨찾기는 이 기기에 저장돼요.</p>`;
  $("edit").onclick = () => { EDIT = !EDIT; renderFav(); };
}

// ---------- 투자자 탭 ----------
function renderGroup(g){
  const list = ((DATA.lists || {})[g.k] || {})[SIDE] || [];
  const rows = list.map((c, i) => {
    const s = DATA.stocks[c], amt = gSum(s, g), n = gStreak(s, g);

      ? `<div class="split">${g.inv.map(j => `<span>${LABELS[j]} <b class="${cls(s.v[j])}">${fmt(s.v[j])}</b></span>`).join("")}</div>` : "";

      <span class="rank">${i + 1}</span><span class="name">${arBadge(s)}${esc(s.n)}${sgBadge(s)}</span>

    </div>${split}</div>`;
  }).join("");
  $("view").innerHTML = `<p class="gdesc">${g.desc}</p>
    <div class="tabs" role="tablist">
      <button class="b" role="tab" aria-selected="${SIDE === "buy"}" data-side="buy">연속 순매수</button>
      <button class="s" role="tab" aria-selected="${SIDE === "sell"}" data-side="sell">연속 순매도</button>
    </div>
    <div class="panel">${rows || '<div class="empty">조건에 맞는 종목이 없어요.</div>'}</div>
    <p class="note">연속 일수가 많은 순서, 같으면 오늘 금액 순서예요. 오늘 ${DATA.minAmt}억 원 이상만 보여요.</p>
    ${Object.values(DATA.stocks).some(x => x.a) ? `<p class="note"><span class="ar up full">정</span><span class="ar down full">역</span>진한 칸은 5·10·20·60·120일선이 완전히 정배열·역배열, <span class="ar up">정</span><span class="ar down">역</span>테두리 칸은 완전하진 않아서 20일선과 60일선만 비교한 결과예요.</p>` : ""}
    ${Object.values(DATA.stocks).some(x => x.g) ? `<p class="note"><span class="sg b">매수①</span><span class="sg s">매도②</span> 박병창 매매 원칙 신호예요. 동그라미 숫자는 원칙 번호, ★는 손바뀜이에요. 종목을 누르면 이유와 손절 기준이 나와요.</p>` : ""}`;
  document.querySelectorAll("[data-side]").forEach(b => b.onclick = () => { SIDE = b.dataset.side; renderGroup(g); });
}

// ---------- 매크로 탭 ----------
function shortDate(ds){ return `${+ds.slice(5, 7)}/${+ds.slice(8, 10)}`; }
function valFmt(k, v){
  if (v == null) return "–";
  if (k === "us10y") return v.toFixed(3) + "%";
  if (k === "btc") return "$" + num(v, 0);
  if (k === "wti") return "$" + num(v, 2);
  if (k === "gold") return "$" + num(v, 1);
  if (k === "lithium") return num(v, 0) + "위안";
  return num(v, 2);
}
function candleSVG(c, noDates){
  const n = c.length, W = 360, H = noDates ? 134 : 150, L = 4, R = 52, T = 8, B = 128, pw = W - L - R;
  const hi = Math.max(...c.map(r => r[2])), lo = Math.min(...c.map(r => r[3])), span = hi - lo || 1;
  const y = v => B - (v - lo) / span * (B - T);
  const step = pw / n, bw = Math.max(1.2, Math.min(7, step * 0.65));
  const x = i => L + step * (i + 0.5);
  const body = c.map((r, i) => {
    const up = r[4] >= r[1], col = up ? "var(--buy)" : "var(--sell)";
    const top = y(Math.max(r[1], r[4])), h = Math.max(1, Math.abs(y(r[1]) - y(r[4])));
    return `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${y(r[2]).toFixed(1)}" y2="${y(r[3]).toFixed(1)}" stroke="${col}" stroke-width="1"/>`
         + `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${col}"/>`;
  }).join("");
  return axisWrap(W, H, L, R, T, B, hi, lo, c[0][0], c[n - 1][0], body, 2, noDates);
}
function lineSVG(p, opt = {}){
  const n = p.length, W = 360, H = 150, L = 4, R = 52, T = 8, B = 128, pw = W - L - R;
  let hi = Math.max(...p.map(r => r[1])), lo = Math.min(...p.map(r => r[1]));
  if (opt.fixed) { hi = opt.fixed[1]; lo = opt.fixed[0]; }
  const span = hi - lo || 1, y = v => B - (v - lo) / span * (B - T);
  const x = i => L + (n === 1 ? pw / 2 : i * pw / (n - 1));
  const pts = p.map((r, i) => `${x(i).toFixed(1)},${y(r[1]).toFixed(1)}`).join(" ");
  const body = `<polygon points="${x(0).toFixed(1)},${B} ${pts} ${x(n - 1).toFixed(1)},${B}" fill="var(--ink)" opacity=".06"/>
    <polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="${x(n - 1).toFixed(1)}" cy="${y(p[n - 1][1]).toFixed(1)}" r="3" fill="var(--ink)"/>`;
  return axisWrap(W, opt.noDates ? 134 : H, L, R, T, B, hi, lo, p[0][0], p[n - 1][0], body, opt.d, opt.noDates);
}
function axisWrap(W, H, L, R, T, B, hi, lo, d0, d1, body, d = 2, noDates = false){
  const f = v => num(v, hi >= 1000 ? 0 : d);
  return `<svg viewBox="0 0 ${W} ${H}">
    <line x1="${L}" x2="${W - R}" y1="${T}" y2="${T}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <line x1="${L}" x2="${W - R}" y1="${B}" y2="${B}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <text class="ax" x="${W - R + 4}" y="${T + 3}">${f(hi)}</text>
    <text class="ax" x="${W - R + 4}" y="${B + 3}">${f(lo)}</text>
    ${body}
    ${noDates ? "" : `<text class="ax" x="${L}" y="${H - 6}">${shortDate(d0)}</text>
    <text class="ax" x="${W - R}" y="${H - 6}" text-anchor="end">${shortDate(d1)}</text>`}
  </svg>`;
}
function changeLine(last, prev, k){
  if (prev == null || last == null) return "";
  const d = last - prev, p = prev ? d / prev * 100 : 0;
  const dv = k === "us10y" ? (Math.abs(d) * 100).toFixed(1) + "bp" : valFmt(k, Math.abs(d)).replace("$", "$");
  return `<div class="mchg ${cls(d)}">전일 대비 ${d > 0 ? "▲" : d < 0 ? "▼" : ""} ${dv} (${pctFmt(p)})</div>`;
}
function macroCard(it){
  const c = it.c.slice(-RANGE);
  if (!c.length) return `<div class="mcard"><div class="mhead"><span class="mn">${esc(it.n)}</span></div><div class="empty-sm">오늘은 자료를 못 받았어요.</div></div>`;
  const last = it.c[it.c.length - 1][4], prev = it.c.length > 1 ? it.c[it.c.length - 2][4] : null;
  return `<div class="mcard"><div class="mhead"><span class="mn">${esc(it.n)}</span>
    <span class="mv ${cls(prev == null ? 0 : last - prev)}">${valFmt(it.k, last)}</span></div>
    ${changeLine(last, prev, it.k)}
    ${it.k === "lithium" ? '<div class="mnote" style="padding:0 4px 6px;text-align:right">톤당 가격, 광저우선물거래소</div>' : ""}
    ${it.k === "gold" ? '<div class="mnote" style="padding:0 4px 6px;text-align:right">온스당 가격, 뉴욕 금 선물</div>' : ""}
    ${(it.k === "kospi" || it.k === "kosdaq") && (MACRO.flows || {})[it.k]
      ? candleSVG(c, true) + flowBlock(MACRO.flows[it.k], "억 원", c.map(r => r[0]))
      : candleSVG(c)}</div>`;
}
const FG_KO = {"extreme fear":"극단적 공포","fear":"공포","neutral":"중립","greed":"탐욕","extreme greed":"극단적 탐욕"};
function fgCard(fg){
  if (!fg || !fg.hist || !fg.hist.length) return `<div class="mcard"><div class="mhead"><span class="mn">공포탐욕지수</span></div><div class="empty-sm">오늘은 자료를 못 받았어요. CNN 사이트 사정으로 가끔 끊길 수 있어요.</div></div>`;
  const s = fg.score, k = s >= 75 ? "extreme greed" : s >= 55 ? "greed" : s > 45 ? "neutral" : s > 25 ? "fear" : "extreme fear";
  const p = fg.hist.slice(-RANGE);
  return `<div class="mcard"><div class="mhead"><span class="mn">공포탐욕지수</span>
    <span class="mv ${s >= 55 ? "up" : s <= 45 ? "down" : "zero"}">${Math.round(s)} ${FG_KO[k]}</span></div>
    <div class="gauge"><i style="left:${Math.max(0, Math.min(100, s))}%"></i></div>
    <div class="gscale"><span>0 극단적 공포</span><span>50</span><span>극단적 탐욕 100</span></div>
    ${lineSVG(p, {fixed:[0, 100], d:0})}
    <div class="mnote">CNN이 주가 흐름, 옵션, 안전자산 수요 등을 묶어 0~100으로 만든 지수예요.</div></div>`;
}
function hyCard(hy){
  if (!hy || !hy.length) return `<div class="mcard"><div class="mhead"><span class="mn">하이일드 스프레드</span></div><div class="empty-sm">오늘은 자료를 못 받았어요.</div></div>`;

let FSEL = 2;                       // 1 개인, 2 외국인, 3 기관
const FNAMES = ["", "개인", "외국인", "기관"];
function runStreak(rows, j){
  let n = 0, sg = 0;
  for (let i = rows.length - 1; i >= 0; i--) {
    const v = rows[i][j];
    if (!v) break;
    const s = v > 0 ? 1 : -1;
    if (!sg) sg = s;
    if (s !== sg) break;
    n++;
  }
  return n * sg;
}
function barsSVG(rows, j, label, dates){
  // dates가 있으면 위 캔들 차트와 같은 날짜 칸에 막대를 맞춤
  const map = {}; rows.forEach(r => { map[r[0]] = r; });
  const ds = dates || rows.map(r => r[0]);
  const n = ds.length, W = 360, H = 118, L = 4, R = 52, T = 18, B = 96, pw = W - L - R;
  const vals = ds.map(dd => (map[dd] ? map[dd][j] : 0) || 0);
  const mx = Math.max(1, ...vals.map(Math.abs)), Z = (T + B) / 2, bh = (B - T) / 2;
  const step = pw / n, bw = Math.max(1.2, Math.min(7, step * 0.65));
  const bars = vals.map((v, i) => {
    if (!v) return "";
    const h = Math.max(1, Math.abs(v) / mx * bh), x = L + step * (i + 0.5);
    return `<rect x="${(x - bw / 2).toFixed(1)}" y="${(v > 0 ? Z - h : Z).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1" fill="var(${v > 0 ? "--buy" : "--sell"})"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}">
    <text class="ax" x="${L}" y="10" style="font-weight:500">${label}</text>
    <line x1="${L}" x2="${W - R}" y1="${Z}" y2="${Z}" stroke="var(--line)"/>
    <text class="ax" x="${W - R + 4}" y="${T + 4}">+${num(mx, 0)}</text>
    <text class="ax" x="${W - R + 4}" y="${B}">−${num(mx, 0)}</text>
    ${bars}
    <text class="ax" x="${L}" y="${H - 6}">${shortDate(ds[0])}</text>
    <text class="ax" x="${W - R}" y="${H - 6}" text-anchor="end">${shortDate(ds[n - 1])}</text>
  </svg>`;
}
function flowBlock(rows, unit, dates){
  if (!rows || !rows.length) return `<div class="empty-sm">수급 자료를 아직 못 받았어요.</div>`;
  const last = rows[rows.length - 1];
  const cells = [1, 2, 3].map(j => {
    const v = last[j], st = runStreak(rows, j);
    return `<div class="fcell"><div class="ln"><span>${FNAMES[j]}</span><b class="${cls(v)}">${v > 0 ? "+" : v < 0 ? "−" : ""}${num(Math.abs(v), 0)}</b></div>
      <small>${st ? `${Math.abs(st)}일 연속 ${st > 0 ? "매수" : "매도"}` : "–"}</small></div>`;
  }).join("");
  const p = dates ? rows : rows.slice(-RANGE);
  return `${barsSVG(p, FSEL, `${FNAMES[FSEL]} 순매수 (${unit})`, dates)}
    <div class="ctabs" style="padding:0 4px">${[1, 2, 3].map(j => `<button type="button" data-fsel="${j}" aria-selected="${j === FSEL}">${FNAMES[j]}</button>`).join("")}</div>
    <div class="munit" style="padding:10px 4px 0">${shortDate(last[0])} 기준, ${unit}</div>
    <div class="fgrid" style="margin-top:6px">${cells}</div>`;
}

// ---------- 미국 히트맵 ----------
function squarify(items, x, y, w, h){
  const out = [];
  let rest = items.slice();
  while (rest.length) {
    const short = Math.min(w, h);
    const worst = r => {
      const s = r.reduce((a, b) => a + b.a, 0), mx = Math.max(...r.map(q => q.a)), mn = Math.min(...r.map(q => q.a));
      return Math.max(short * short * mx / (s * s), (s * s) / (short * short * mn));
    };
    const row = [rest[0]];
    let i = 1;
    while (i < rest.length && worst(row.concat([rest[i]])) <= worst(row)) { row.push(rest[i]); i++; }
    const s = row.reduce((a, b) => a + b.a, 0);
    if (w >= h) {
      const cw = s / h; let cy = y;
      row.forEach(r => { const rh = r.a / cw; out.push(Object.assign({}, r, {x, y: cy, w: cw, h: rh})); cy += rh; });
      x += cw; w -= cw;
    } else {
      const rh = s / w; let cx = x;
      row.forEach(r => { const rw = r.a / rh; out.push(Object.assign({}, r, {x: cx, y, w: rw, h: rh})); cx += rw; });
      y += rh; h -= rh;
    }
    rest = rest.slice(i);
  }
  return out;
}
function heatColor(c){
  const k = Math.min(Math.abs(c) / 3, 1);              // 3% 이상이면 가장 진하게
  if (Math.abs(c) < 0.05) return "#8A8F98";
  const mix = (a, b) => Math.round(a + (b - a) * k);
  return c > 0 ? `rgb(${mix(196,200)},${mix(150,30)},${mix(155,48)})`   // 빨강
               : `rgb(${mix(140,28)},${mix(165,86)},${mix(205,196)})`; // 파랑
}
function heatCard(){
  const hm = MACRO.heat;
  if (!hm || !hm.items || !hm.items.length)
    return `<div class="mcard"><div class="mhead"><span class="mn">미국 주요 종목 히트맵</span></div><div class="empty-sm">아직 자료가 없어요. 새 collect.py를 올리고 실행하면 생겨요.</div></div>`;
  const W = 300, H = 400;
  const secs = {};
  hm.items.forEach(it => { (secs[it.s] = secs[it.s] || []).push(it); });
  const total = hm.items.reduce((a, b) => a + b.cap, 0);
  const secList = Object.entries(secs).map(([n, arr]) => ({n, arr, a: arr.reduce((a, b) => a + b.cap, 0) / total * W * H}))
    .sort((a, b) => b.a - a.a);
  let html = "";
  squarify(secList, 0, 0, W, H).forEach(sec => {
    const sum = sec.arr.reduce((a, b) => a + b.cap, 0);
    const kids = sec.arr.map(it => Object.assign({}, it, {a: it.cap / sum * sec.w * sec.h})).sort((a, b) => b.a - a.a);
    squarify(kids, sec.x, sec.y, sec.w, sec.h).forEach(b => {
      const big = b.w > 26 && b.h > 18, mid = b.w > 18 && b.h > 11;
      html += `<div class="hb" title="${b.t} ${b.c}%" style="left:${b.x / W * 100}%;top:${b.y / H * 100}%;width:${b.w / W * 100}%;height:${b.h / H * 100}%;background:${heatColor(b.c)}">
        ${mid ? `<b style="font-size:${Math.max(8, Math.min(15, b.w / 4.5))}px">${b.t.replace("-B", "")}</b>` : ""}
        ${big ? `<span>${b.c > 0 ? "+" : ""}${b.c.toFixed(1)}%</span>` : ""}</div>`;
    });
    html += `<div class="hs" style="left:${sec.x / W * 100}%;top:${sec.y / H * 100}%;width:${sec.w / W * 100}%;height:${sec.h / H * 100}%"><i>${sec.w > 40 ? sec.n : ""}</i></div>`;
  });
  const label = hm.mode === "pre" ? "프리장 등락" : "직전 정규장 등락";
  const at = hm.at ? `${shortDate(hm.at)} ${hm.at.slice(11)} 기준` : "";
  const legend = [-3, -2, -1, 0, 1, 2, 3].map(v => `<i style="background:${heatColor(v)}"></i>`).join("");
  return `<div class="mcard"><div class="mhead"><span class="mn">미국 주요 종목 히트맵</span><span class="munit">${label}</span></div>
    <div class="heat">${html}</div>
    <div class="hlegend"><span>−3%</span>${legend}<span>+3%</span></div>
    <div class="mnote">${at}. 네모 크기는 시가총액, 같은 업종끼리 묶었어요. 프리장은 거래가 적어 정규장에서 크게 바뀔 수 있어요.</div>
    <a class="golink" href="https://finviz.com/map.ashx?t=sec" target="_blank" rel="noopener">실시간 히트맵 보기 (핀비즈) ↗</a></div>`;
}

function search(){
  const raw = $("q").value.trim();
  if (!DATA || raw === lastQ) return;
  lastQ = raw;
  if (!raw){ $("result").innerHTML = ""; return; }
  const q = norm(ALIAS[raw] || raw);
  HITS = Object.entries(DATA.stocks)
    .filter(([c, s]) => c === q || norm(s.n).includes(q))
    .sort((a, b) => (norm(a[1].n) === q ? -1 : 0) - (norm(b[1].n) === q ? -1 : 0) || a[1].n.length - b[1].n.length)
    .slice(0, 10).map(([c]) => c);
  renderResult(raw, HITS);
}

}
let CH = "pension";
function sigName(t, n){ return t === "B" ? `매수${CIRC[n] || ""}` : t === "S" ? `매도${CIRC[n] || ""}` : t === "W" ? "주의" : "바닥관찰"; }
function chartSVG(rowsNewestFirst, g){
  const rows = rowsNewestFirst.filter(r => r[1] != null).slice().reverse();
  const n = rows.length, W = 360, L = 6, R = 44, pw = W - L - R;
  if (!n) return "";
  const x = i => L + (n === 1 ? pw / 2 : i * pw / (n - 1));
  const px = rows.map(r => r[1]);
  const lo = Math.min(...px), hi = Math.max(...px), span = hi - lo || 1;
  const PT = 16, PB = 112, y = v => PB - (v - lo) / span * (PB - PT);
  const line = rows.map((r, i) => `${x(i).toFixed(1)},${y(r[1]).toFixed(1)}`).join(" ");
  const vals = rows.map(r => Math.round(g.inv.reduce((a, j) => a + (r[3 + j] || 0), 0) * 10) / 10);
  const mx = Math.max(1, ...vals.map(v => Math.abs(v)));
  const BT = 136, BB = 214, Z = (BT + BB) / 2, bh = (BB - BT) / 2;
  const bw = Math.max(3, Math.min(12, pw / n * 0.6));
  const bars = vals.map((v, i) => {
    if (!v) return "";
    const h = Math.abs(v) / mx * bh;
    return `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${(v > 0 ? Z - h : Z).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h, 1).toFixed(1)}" rx="1.5" fill="var(${v > 0 ? "--buy" : "--sell"})"/>`;
  }).join("");
  const dates = [0, Math.floor((n - 1) / 2), n - 1].filter((v, i, a) => a.indexOf(v) === i)
    .map(i => `<text class="ax" x="${x(i).toFixed(1)}" y="230" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${rows[i][0]}</text>`).join("");
  return `<svg viewBox="0 0 ${W} 236" role="img" aria-label="종가와 순매수 차트">
    <text class="lbl" x="${L}" y="10">종가</text>
    <line x1="${L}" x2="${W - R}" y1="${PT}" y2="${PT}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <line x1="${L}" x2="${W - R}" y1="${PB}" y2="${PB}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <text class="ax" x="${W - R + 4}" y="${PT + 3}">${hi.toLocaleString("ko-KR")}</text>
    <text class="ax" x="${W - R + 4}" y="${PB + 3}">${lo.toLocaleString("ko-KR")}</text>
    <polygon points="${x(0).toFixed(1)},${PB} ${line} ${x(n - 1).toFixed(1)},${PB}" fill="var(--ink)" opacity=".06"/>
    <polyline points="${line}" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="${x(n - 1).toFixed(1)}" cy="${y(rows[n - 1][1]).toFixed(1)}" r="3" fill="var(--ink)"/>
    ${(() => {
      const st = OPEN && DATA.stocks[OPEN];
      const hm = {}; ((st && st.h) || []).forEach(h => { hm[h[0]] = h; });
      return rows.map((r, i) => {
        const h = hm[r[0]]; if (!h) return "";
        const cx = x(i), cy = y(r[1]), up = h[1] === "B" || h[1] === "L";
        const col = h[1] === "B" ? "var(--buy)" : h[1] === "S" ? "var(--sell)" : h[1] === "W" ? "#C98A00" : "#6A7180";
        const ty = up ? cy + 9 : cy - 9;
        const tri = up ? `${cx - 5},${ty + 7} ${cx + 5},${ty + 7} ${cx},${ty}` : `${cx - 5},${ty - 7} ${cx + 5},${ty - 7} ${cx},${ty}`;
        return `<polygon points="${tri}" fill="${col}"/>`;
      }).join("");
    })()}
    <text class="lbl" x="${L}" y="${BT - 4}">${g.tab} 순매수 (억 원)</text>
    <line x1="${L}" x2="${W - R}" y1="${Z}" y2="${Z}" stroke="var(--line)"/>
    <text class="ax" x="${W - R + 4}" y="${BT + 4}">+${Math.round(mx).toLocaleString("ko-KR")}</text>
    <text class="ax" x="${W - R + 4}" y="${BB}">−${Math.round(mx).toLocaleString("ko-KR")}</text>
    ${bars}${dates}</svg>`;
}
function renderChart(rows){
  const g = GROUPS.find(x => x.k === CH) || GROUPS[0];
  const st = OPEN && DATA.stocks[OPEN], hs = (st && st.h) || [];
  const hlist = hs.length
    ? `<div class="mnote" style="padding:2px 4px 6px">▲ 매수·바닥관찰 ▼ 매도·주의 · 최근 신호: ${hs.slice().reverse().map(h => `<b class="${h[1] === "B" || h[1] === "L" ? "up" : "down"}">${h[0]} ${sigName(h[1], h[2])}</b>`).join(", ")}</div>`
    : `<div class="mnote" style="padding:2px 4px 6px">최근 20거래일 동안 뜬 신호가 없어요.</div>`;
  $("chart").innerHTML = chartSVG(rows, g) + hlist + `<div class="ctabs">${GROUPS.map(x =>
    `<button type="button" data-ch="${x.k}" aria-selected="${x.k === g.k}">${x.tab}</button>`).join("")}</div>`;
  $("chart").querySelectorAll("[data-ch]").forEach(b => b.onclick = () => { CH = b.dataset.ch; renderChart(rows); });
}
function paintSheetStar(){
  const on = OPEN && isFav(OPEN);
  $("sstar").className = "star" + (on ? " on" : "");
  $("sstar").textContent = on ? "★ 즐겨찾기" : "☆ 즐겨찾기";
}
async function openDetail(code){
  const s = DATA.stocks[code];
  if (!s) return;
  OPEN = code;
  $("sname").innerHTML = arBadge(s) + esc(s.n);
  paintSheetStar();
  $("sbody").innerHTML = `<div class="empty">불러오는 중…</div>`;
  $("sheet").classList.add("open");
  document.body.style.overflow = "hidden";
  if (!history.state || !history.state.sheet) history.pushState({sheet:true}, "");
  const h = HOLD[code];
  const holdUI = `<div class="holdform"><input id="holdp" type="number" inputmode="numeric" placeholder="매수가 (원)" value="${h ? h.p : ""}">
    <button type="button" class="tool" id="holdsave">${h ? "매수가 수정" : "보유 등록"}</button>${h ? '<button type="button" class="tool" id="holddel">해제</button>' : ""}</div>`;
  const hst = h ? holdStatus(code) : null;
  const holdInfo = hst ? `<div class="sgline"><div>내 보유: 매수가 ${num(h.p, 0)}원 → 종가 ${num(hst.close, 0)}원 (<b class="${cls(hst.ret)}">${pctFmt(hst.ret)}</b>) · −5% 선 ${num(hst.stopPrice, 0)}원${hst.alerts.length ? "<br>⚠️ " + hst.alerts.map(esc).join("<br>⚠️ ") : ""}</div></div>` : "";
  const chips = holdInfo + holdUI + sgLine(s) + `<div class="chips">${GROUPS.map(g => {
    const n = gStreak(s, g);
    return `<span class="chip ${cls(n)}">${g.tab} ${n ? streakText(n) : "연속 없음"}</span>`;
  }).join("")}</div>`;
  await loadDays();
  if (OPEN !== code) return;
  const rows = rowsFor(code);
  if (!rows.length){ $("sbody").innerHTML = chips + `<div class="panel"><div class="empty">일자별 자료가 없어요.</div></div>`; return; }
  CH = GROUPS.some(x => x.k === TAB) ? TAB : "pension";
  const cols = ["날짜","종가","등락률","연기금","사모","투신","기관","외국인","개인"];
  const body = rows.map(r => `<tr><td>${r[0]}</td><td class="px">${r[1] == null ? "–" : r[1].toLocaleString("ko-KR")}</td>
    <td class="${cls(r[2])}">${pctFmt(r[2])}</td>${r.slice(3).map(v => `<td class="${cls(v)}">${fmt(v)}</td>`).join("")}</tr>`).join("");
  $("sbody").innerHTML = chips + `<div class="chartbox" id="chart"></div>
    <div class="tbl"><table><thead><tr>${cols.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
    <p class="note">금액 단위는 억 원이에요. 표는 옆으로 밀어서 볼 수 있어요.</p>`;
  renderChart(rows);
}
function closeSheet(){
  $("sheet").classList.remove("open");
  document.body.style.overflow = "";
  OPEN = null;
  const hb = document.getElementById("holdwrap");
  if (hb && DATA) hb.innerHTML = holdBanner();
  if (TAB === "fav") renderFav();
}
$("sclose").onclick = () => { if (history.state && history.state.sheet) history.back(); else closeSheet(); };
$("sstar").onclick = () => { if (OPEN){ toggleFav(OPEN); paintSheetStar(); } };
window.addEventListener("popstate", closeSheet);
document.addEventListener("click", e => {
  if (e.target.closest("#holdsave")) {
    const v = Number(($("holdp") || {}).value);
    if (OPEN && v > 0) { HOLD[OPEN] = {p: v, d: new Date().toISOString().slice(0, 10)}; saveHold(); openDetail(OPEN); }
    return;
  }
  if (e.target.closest("#holddel")) {
    if (OPEN) { delete HOLD[OPEN]; saveHold(); openDetail(OPEN); }
    return;
  }
  if (e.target.closest("#holdbar")) { TAB = "fav"; EDIT = false; render(); window.scrollTo(0, 0); return; }
  const uh = e.target.closest("[data-unhold]");
  if (uh) { delete HOLD[uh.dataset.unhold]; saveHold(); render(); return; }
  const st = e.target.closest("[data-star]");
  if (st){ e.stopPropagation(); toggleFav(st.dataset.star); renderResult(lastQ || "", HITS); if (TAB === "fav") renderFav(); return; }
  const del = e.target.closest("[data-del]");
  if (del){ FAVS = FAVS.filter(f => f.c !== del.dataset.del); saveFavs(); renderFav(); return; }
  const row = e.target.closest(".row[data-code]");
  if (row && DATA) openDetail(row.dataset.code);
});

// ---------- 시작 ----------
(async () => {
  const get = (u, ok) => fetch(u + "?t=" + Date.now(), {cache:"no-store"}).then(r => r.ok ? r.json() : null).catch(() => null);
  const [d, w, m, mo, pf] = await Promise.all([get("data.json"), get("watchlist.json"), get("macro.json"), get("morning.json"), get("perf.json")]);
  MORNING = mo && mo.items ? mo : null;
  PERF = pf && pf.stats ? pf : null;
  MACRO = m && m.items ? m : null;
  if (d && d.lists && d.groups && d.days) {
    DATA = d;
    loadFavs(Array.isArray(w) ? w : []);
    const dt = new Date(d.date + "T00:00:00");
    const md = `${dt.getMonth() + 1}월 ${dt.getDate()}일(${"일월화수목금토"[dt.getDay()]})`;
    $("meta").textContent = d.final === false
      ? `수급 ${md} ${d.updated.slice(11)} 중간 집계(잠정), 단위 억 원`
      : `수급 ${md} 장 마감 기준, 단위 억 원`;
  } else {
    $("meta").textContent = "새 방식 자료를 기다리는 중이에요. Actions에서 daily를 실행해 주세요.";
  }
  render();
})();
</script>
